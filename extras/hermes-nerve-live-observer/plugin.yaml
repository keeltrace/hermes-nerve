manifest_version: 2
api_version: 1
name: hermes-nerve-live-observer
version: "0.1.0-staging"
description: "Observe-only, opt-in (HERMES_NERVE_LIVE_ENABLED=1) Nerve live telemetry writer. Stdlib only. Allowlisted metadata, HMAC-hashed IDs, capped per-PID JSONL, heartbeat leases."

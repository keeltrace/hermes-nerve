[project]
name = "hermes-nerve"
version = "0.3.1"
description = "Nerve supervisory nervous system for Hermes Agent with provider-neutral Jev/Laya/OpenJev Reflex backends, evidence-backed Kanban supervision, context governance, and SSH workers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "KeelTrace community"}]
dependencies = []

[project.scripts]
nerve = "hermes_nerve.cli:main"

[project.urls]
Homepage = "https://github.com/keeltrace/hermes-nerve"
Issues = "https://github.com/keeltrace/hermes-nerve/issues"

[tool.setuptools.packages.find]
include = ["hermes_nerve*", "hermes_jev*"]
exclude = ["tests*", "review*", "planning*", "contracts*", "packaging*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["PyYAML>=6,<7", "tomli>=2,<3; python_version < '3.11'"]
laya = ["laya==0.3.3"]

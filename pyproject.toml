[project]
name = "hermes-nerve"
dynamic = ["version"]
description = "Nerve supervisory nervous system for Hermes Agent with provider-neutral System One Reflex backends, evidence-backed Kanban supervision, context governance, and SSH workers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "KeelTrace community"}]
# Intentionally dependency-free (release-verifier contract): PyYAML and the
# rest of the runtime are provided by the Hermes host environment.
dependencies = []

[project.scripts]
nerve = "hermes_nerve.cli:main"

[project.urls]
Homepage = "https://github.com/keeltrace/hermes-nerve"
Issues = "https://github.com/keeltrace/hermes-nerve/issues"

[tool.setuptools.dynamic]
version = {attr = "hermes_nerve._version.__version__"}

[tool.setuptools.packages.find]
include = ["hermes_nerve*", "hermes_jev*"]
exclude = ["tests*", "review*", "planning*", "contracts*", "packaging*"]

[tool.setuptools.package-data]
hermes_nerve = ["web/*.html", "web/*.css", "web/*.js", "research/*.md", "policy/*.txt"]

[tool.setuptools.data-files]
"share/hermes-nerve" = ["plugin.yaml", "__init__.py", "CONTRIBUTORS.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Deliberately NO [project.optional-dependencies], dependency groups, or build-system.
# Hermes includes a plugin pyproject in its shared uv workspace if it declares
# *any* installable extra/group. When uv resolves all workspace environments,
# Laya -> Torch made regular Hermes updates disable Nerve for Android/Python 3.14.
# Nerve's runtime is dependency-free. Laya/D1 are installed ONLY into their
# separate, opt-in sidecar venvs by hermes_nerve.local_backend_setup.
# Contributor test dependencies are documented in CONTRIBUTING.md, not extras.

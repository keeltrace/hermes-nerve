name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install verification dependency
        run: python -m pip install "PyYAML>=6,<7" "pytest>=8,<9" "tomli>=2,<3; python_version < '3.11'"

      - name: Verify development catalog boundary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          version="$(python -c 'import yaml; print(yaml.safe_load(open("plugin.yaml"))["version"])')"
          if [[ "$version" == *".dev"* ]]; then
            git diff --exit-code "${{ github.event.pull_request.base.sha }}" HEAD -- packaging/hermes-catalog/nerve.yaml
          fi

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile
        run: python -m compileall -q .

      - name: Verify release metadata and public surface
        run: python scripts/verify_release.py

      - name: Verify self-contained release package
        if: matrix.python-version == '3.14'
        env:
          # Runtime-identity hashing tests are CPU-bound. Avoid oversubscribing
          # hosted runners; retain every test and the existing per-file deadline.
          JEV_TEST_JOBS: "2"
        run: bash scripts/verify_dev17.sh

  required-matrix-compat:
    name: test (3.10) test (3.11) test (3.12) test (3.13)
    needs: test
    runs-on: ubuntu-latest
    if: ${{ always() && needs.test.result == 'success' }}
    steps:
      - run: echo "Required matrix compatibility check passed."

  plugin-runtime-validation:
    name: Hermes plugin validate + doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Upstream permits older Python for updater bootstrapping only;
          # runtime dependencies are declared for supported Python >=3.14.
          python-version: "3.14"

      - name: Install pinned Hermes development checkout
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          git -C /tmp/hermes-agent checkout 1c0cd667746d3395fe9e1b6c74f8f85952486f18
          # Use upstream PM, not raw pip: uv.lock records intentional security
          # overrides (e.g. Pillow 13 vs browser-harness's older exact pin).
          HERMES_HOME="$RUNNER_TEMP/hermes-validation-home" \
          PYTHONPATH=/tmp/hermes-agent python -m pm.build_env \
            --source /tmp/hermes-agent \
            --out "$RUNNER_TEMP/hermes-validation-venv" \
            --python "$(command -v python)"
          printf '%s\n' "$RUNNER_TEMP/hermes-validation-venv/bin" >> "$GITHUB_PATH"

      - name: Validate with plugin dependencies
        run: hermes plugins validate --install-deps .

      - name: Native Selective Context request integration
        run: PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" python tests/test_selective_context_request.py -v

      - name: Runtime plugin doctor
        run: hermes plugins doctor . --ci


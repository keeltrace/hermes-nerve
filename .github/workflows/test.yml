name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install verification dependency
        run: python -m pip install "PyYAML>=6,<7" "pytest>=8,<9" "tomli>=2,<3; python_version < '3.11'"

      - name: Verify development catalog boundary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          version="$(python -c 'import yaml; print(yaml.safe_load(open("plugin.yaml"))["version"])')"
          if [[ "$version" == *".dev"* ]]; then
            git diff --exit-code "${{ github.event.pull_request.base.sha }}" HEAD -- packaging/hermes-catalog/nerve.yaml
          fi

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile
        run: python -m compileall -q .

      - name: Verify release metadata and public surface
        run: python scripts/verify_release.py

      - name: Verify self-contained release package
        if: matrix.python-version == '3.14'
        run: bash scripts/verify_dev17.sh

  required-matrix-compat:
    name: test (3.10) test (3.11) test (3.12) test (3.13)
    needs: test
    runs-on: ubuntu-latest
    if: ${{ always() && needs.test.result == 'success' }}
    steps:
      - run: echo "Required matrix compatibility check passed."

  plugin-runtime-validation:
    name: Hermes plugin validate + doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned Hermes development checkout
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          git -C /tmp/hermes-agent checkout ee8a919fd2769166d45ebf67f45ff5b1acec69fe
          python -m pip install -e /tmp/hermes-agent

      - name: Validate with plugin dependencies
        # Admission scan with a disclosed exception: Nerve's policy engine must
        # contain the literal patterns it blocks (see SECURITY_SCAN_ALLOWLIST.txt).
        # The step fails on any finding OUTSIDE the allowlist, and on any other
        # validation failure. Install-time behavior on user machines is unchanged.
        run: |
          set -uo pipefail
          OUT=$(hermes plugins validate --install-deps . 2>&1) || STATUS=$?
          printf '%s\n' "$OUT"
          if [ "${STATUS:-0}" -eq 0 ]; then exit 0; fi
          FAILS=$(printf '%s\n' "$OUT" | grep -E '^✗' || true)
          NON_SCAN_FAILS=$(printf '%s\n' "$FAILS" | grep -v 'security scan' || true)
          if [ -n "$NON_SCAN_FAILS" ]; then
            echo "::error::validation failed outside the security scan:"; printf '%s\n' "$NON_SCAN_FAILS"; exit 1
          fi
          SCAN_ALL=$(printf '%s\n' "$OUT" | sed -n '/security scan/,/Validation failed/p' | tr '\n' ' ')
          python3 - "$SCAN_ALL" <<'PY' || exit 1
          import re, sys
          line = sys.argv[1]
          pairs = re.findall(r'(\w+) \(([^:)]+):\d+\)', line)
          rules = []
          for raw in Path("SECURITY_SCAN_ALLOWLIST.txt").read_text().splitlines():
              raw = raw.strip()
              if raw and not raw.startswith("#"):
                  pid, prefix = raw.split(None, 1)
                  rules.append((pid, prefix.strip()))
          def allowed(pid, path):
              return any(pid == rpid and path.startswith(rprefix) for rpid, rprefix in rules)
          unallowed = [(p, f) for p, f in pairs if not allowed(p, f)]
          if not pairs:
              print("::error::security scan failed with no parsable findings; refusing to allowlist"); sys.exit(1)
          if unallowed:
              print("::error::findings outside the disclosed allowlist:")
              for p, f in unallowed: print(f"  - {p} ({f})")
              sys.exit(1)
          print(f"All {len(pairs)} scan findings are within the disclosed policy-engine allowlist (SECURITY_SCAN_ALLOWLIST.txt).")
          PY
          {
            echo "## Documented security-scan exception"
            echo "All findings below are Nerve policy-engine content (pattern definitions, denial-test fixtures, blocked-prefix tables) within \`SECURITY_SCAN_ALLOWLIST.txt\`."
            echo '```'
            printf '%s' "$SCAN_ALL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Runtime plugin doctor
        run: hermes plugins doctor . --ci


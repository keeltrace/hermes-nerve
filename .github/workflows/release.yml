name: release

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (for example 0.3.0)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install verification dependency
        run: python -m pip install "PyYAML>=6,<7" "pytest>=8,<9" "tomli>=2,<3; python_version < '3.11'"

      - name: Resolve and verify release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          requested = os.environ.get("REQUESTED_VERSION", "").strip()
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          actual = pyproject["project"]["version"]
          if requested and actual != requested:
              raise SystemExit(f"requested version {requested!r} does not match pyproject version {actual!r}")
          version = requested or actual
          if ".dev" in version:
              raise SystemExit("development versions cannot be published by the stable release workflow")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"VERSION={version}\n")
          PY

      - name: Verify default branch
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import os
          ref_name = os.environ["REF_NAME"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          if ref_name != default_branch:
              raise SystemExit(f"release workflow must run from default branch {default_branch!r}, not {ref_name!r}")
          PY

      - name: Verify candidate
        run: bash scripts/verify_dev17.sh

      - name: Check existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(mktemp)"
          release_err="$(mktemp)"
          release_rc=0
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" >"${release_json}" 2>"${release_err}" || release_rc=$?

          tag_json="$(mktemp)"
          tag_err="$(mktemp)"
          tag_rc=0
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >"${tag_json}" 2>"${tag_err}" || tag_rc=$?

          if [ "${release_rc}" -eq 0 ]; then
            current_name="$(jq -r .name <"${release_json}")"
            if [ "${tag_rc}" -ne 0 ]; then
              echo "Release v${VERSION} exists but its authoritative tag could not be resolved." >&2
              cat "${tag_err}" >&2
              exit 1
            fi

            current_target="$(jq -r .object.sha <"${tag_json}")"
            current_type="$(jq -r .object.type <"${tag_json}")"
            while [ "${current_type}" = "tag" ]; do
              peeled_json="$(mktemp)"
              if ! gh api "repos/${GITHUB_REPOSITORY}/git/tags/${current_target}" >"${peeled_json}"; then
                echo "Could not peel annotated tag v${VERSION}." >&2
                exit 1
              fi
              current_target="$(jq -r .object.sha <"${peeled_json}")"
              current_type="$(jq -r .object.type <"${peeled_json}")"
            done
            if [ "${current_type}" != "commit" ]; then
              echo "Tag v${VERSION} resolves to unexpected object type ${current_type}." >&2
              exit 1
            fi

            if [ "$current_name" = "Nerve v${VERSION}" ] && [ "$current_target" = "${GITHUB_SHA}" ]; then
              echo "Release v${VERSION} already targets this exact commit; nothing to publish."
              echo "RELEASE_EXISTS=1" >> "${GITHUB_ENV}"
            else
              echo "Release v${VERSION} already exists and is immutable: name=$current_name target=$current_target requested=${GITHUB_SHA}" >&2
              exit 1
            fi
          elif grep -q 'HTTP 404' "${release_err}"; then
            if [ "${tag_rc}" -eq 0 ]; then
              current_target="$(jq -r .object.sha <"${tag_json}")"
              echo "Tag v${VERSION} already exists at ${current_target} without a matching GitHub release; refusing to reuse it." >&2
              exit 1
            elif grep -q 'HTTP 404' "${tag_err}"; then
              echo "RELEASE_EXISTS=0" >> "${GITHUB_ENV}"
            else
              echo "Could not determine whether tag v${VERSION} exists." >&2
              cat "${tag_err}" >&2
              exit 1
            fi
          else
            echo "Could not determine whether release v${VERSION} exists." >&2
            cat "${release_err}" >&2
            exit 1
          fi

      - name: Build source archives
        if: env.RELEASE_EXISTS != '1'
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="nerve-v${VERSION}/" -o "dist/nerve-v${VERSION}.zip" HEAD
          git archive --format=tar.gz --prefix="nerve-v${VERSION}/" -o "dist/nerve-v${VERSION}.tar.gz" HEAD
          (cd dist && sha256sum nerve-v${VERSION}.zip nerve-v${VERSION}.tar.gz > SHA256SUMS.txt)
          python - <<'PYREL'
          import os, re
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text()
          pattern = rf"^## {re.escape(version)}\b.*?(?=^## |\Z)"
          match = re.search(pattern, changelog, re.M | re.S)
          if not match:
              raise SystemExit(f"CHANGELOG.md has no release section for {version}")
          section = match.group(0).strip()
          body = section.split("\n", 1)[1].lstrip() if "\n" in section else ""
          Path("dist/RELEASE_NOTES.md").write_text(f"## Nerve v{version}\n\n{body}\n")
          PYREL

      - name: Create GitHub release
        if: env.RELEASE_EXISTS != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            "dist/nerve-v${VERSION}.zip" \
            "dist/nerve-v${VERSION}.tar.gz" \
            "dist/SHA256SUMS.txt" \
            --target "${GITHUB_SHA}" \
            --title "Nerve v${VERSION}" \
            --notes-file dist/RELEASE_NOTES.md \
            --generate-notes

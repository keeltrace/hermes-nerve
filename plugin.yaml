name: nerve
version: "0.3.1rc1"
description: "Nerve supervisory nervous system for Hermes Agent with Jev, Laya, and OpenJev Reflex backends, evidence-backed Kanban supervision, token-budget trajectory control, context governance, and durable SSH Hermes workers."
author: "KeelTrace community"
license: MIT
homepage: https://github.com/keeltrace/hermes-nerve
tags: [nerve, jev, openjev, laya, reflex, system-one, decisions, kanban, definition-of-done, evidence, remote-worker, ssh, distributed, verification]
provides_tools:
  - nerve_decide
  - nerve_rank
  - nerve_verify
  - nerve_assess
  - nerve_context_curate
  - nerve_context_rehydrate
  - nerve_stats
  - nerve_nervous_event
  - nerve_supervise_card
  - nerve_work_event
  - nerve_work_status
  - nerve_remote_delegate_task
  - nerve_remote_worker_status
  - nerve_remote_worker_result
  - nerve_remote_worker_cancel
  - nerve_remote_worker_control
provides_hooks: [pre_tool_call, post_tool_call, pre_llm_call, transform_tool_result, pre_verify, post_api_request, api_request_error, post_llm_call, on_session_end]
requires_env: []
config_schema:
  nerve_profile: {type: str, default: "", description: "Optional Nerve personality: fat_cat, operator, lean, marie_kondo, or custom. Empty preserves v0.2.3 legacy behavior."}
  nerve_modules: {type: dict, default: {}, description: "Explicit per-module boolean overrides layered on the selected Nerve personality."}
  assistant_review_min_confidence: {type: float, default: 0.75}
  assistant_audit_min_confidence: {type: float, default: 0.70}
  assistant_prompt_max_chars: {type: int, default: 4000}
  assistant_provider_max_chars: {type: int, default: 6000}
  model_id: {type: str, default: "typesafe/jev-1.13", description: "Legacy model alias used only as the fallback for jev_model."}
  jev_provider: {type: str, default: "openrouter"}
  jev_model: {type: str, default: "typesafe/jev-1.13"}
  typesafe_model: {type: str, default: "jev-latest"}
  opencode_model: {type: str, default: "jev-1.13"}
  timeout_seconds: {type: float, default: 10.0}
  reflex_backend: {type: str, default: "jev", description: "Decision backend: jev, laya, openjev, or shadow."}
  reflex_laya_base_url: {type: str, default: "http://127.0.0.1:8765", description: "Laya sidecar base URL. Loopback HTTP or HTTPS only."}
  reflex_laya_model: {type: str, default: "convaiinnovations/laya-typed-decisions", description: "Expected fixed Laya checkpoint identity exposed by the sidecar."}
  reflex_laya_timeout_seconds: {type: float, default: 5.0, description: "Laya sidecar request timeout."}
  reflex_laya_token: {type: str, default: "", description: "Optional bearer token for the Laya sidecar."}
  reflex_openjev_base_url: {type: str, default: "http://127.0.0.1:3000", description: "OpenJev helper base URL. Loopback HTTP or HTTPS only."}
  reflex_openjev_model: {type: str, default: "openjev", description: "Request model label sent to the OpenJev helper."}
  reflex_openjev_timeout_seconds: {type: float, default: 10.0, description: "OpenJev helper request timeout."}
  reflex_openjev_token: {type: str, default: "", description: "Optional SHIM_TOKEN bearer token for the OpenJev helper."}
  reflex_openjev_expected_identity: {type: str, default: "", description: "Optional substring pin for OpenJev /v1/version and response model identity."}
  reflex_shadow_backend: {type: str, default: "laya", description: "Open-source backend used when reflex_backend=shadow: laya or openjev."}
  reflex_shadow_async: {type: bool, default: true, description: "Run the selected open-source shadow request asynchronously so Jev latency remains authoritative."}
  reflex_shadow_log: {type: str, default: "", description: "Optional paired Jev/open-source shadow JSONL path."}
  gate_mode: {type: str, default: "off"}
  gate_scope: {type: str, default: "selective"}
  min_confidence: {type: float, default: 0.80}
  min_allow_probability: {type: float, default: 0.90, description: "Enforce mode: minimum p(ALLOW) for an ALLOW verdict to continue without a human."}
  receipt_detail: {type: str, default: "hash"}
  nervous_enabled: {type: bool, default: true}
  nervous_turn_admission: {type: bool, default: true}
  nervous_mode: {type: str, default: "correct_next"}
  nervous_challenge_confidence: {type: float, default: 0.86}
  nervous_call_threshold: {type: float, default: 0.58}
  nervous_max_provider_calls_per_turn: {type: int, default: 96}
  nervous_event_preview_chars: {type: int, default: 1200}
  nervous_retain_recent_events: {type: int, default: 64}
  nervous_emit_prompt_hint: {type: bool, default: false}
  nervous_local_learning: {type: bool, default: true}
  nervous_local_learning_min_samples: {type: int, default: 8}
  nervous_repeated_failure_local_replan_at: {type: int, default: 3}
  context_ledger_enabled: {type: bool, default: true}
  context_ledger_detail: {type: str, default: "sanitized"}
  context_preview_chars: {type: int, default: 1200}
  context_anchor_chars: {type: int, default: 220}
  context_preserve_tail: {type: int, default: 4}
  context_curation_mode: {type: str, default: "shadow"}
  context_drop_max_needed: {type: float, default: 0.20}
  context_drop_max_exact: {type: float, default: 0.20}
  context_drop_min_superseded: {type: float, default: 0.75}
  context_anchor_max_needed: {type: float, default: 0.55}
  context_anchor_max_exact: {type: float, default: 0.45}
  context_conflict_pin_min: {type: float, default: 0.70}
  context_engine_register: {type: bool, default: true}
  context_engine_mode: {type: str, default: "shadow"}
  context_engine_threshold_percent: {type: float, default: 0.72}
  context_engine_protect_first_n: {type: int, default: 3}
  context_engine_protect_last_n: {type: int, default: 6}
  context_engine_shadow_trigger_percent: {type: float, default: 0.55}
  context_engine_fallback_builtin: {type: bool, default: true}
  work_supervision_enabled: {type: bool, default: true, description: "Enable DoD/evidence/budget supervision for canonical Kanban runs."}
  work_supervision_mode: {type: str, default: "advisory", description: "shadow, advisory, or enforce."}
  work_supervision_db: {type: str, default: ""}
  work_evidence_preview_chars: {type: int, default: 1200}
  work_calibration_min_samples: {type: int, default: 12}
  work_calibration_max_brier: {type: float, default: 0.24}
  work_enforcement_override: {type: bool, default: false}
  work_control_confidence: {type: float, default: 0.86}
  work_reviewer: {type: str, default: ""}
  work_auto_bind_kanban: {type: bool, default: true}
  work_headless_workers: {type: bool, default: true, description: "Hide Nerve tool schemas from ordinary Kanban workers; supervision runs through hooks."}
  work_default_task_budget_tokens: {type: int, default: 70000}
  work_checkpoint_fractions: {type: str, default: "0.40,0.70"}
  work_supervisor_budget_fraction: {type: float, default: 0.03}
  work_roi_min_expected_savings_tokens: {type: int, default: 1500}
  work_provider_decision_cooldown_tokens: {type: int, default: 8000}
  work_estimated_decision_call_tokens: {type: int, default: 800, description: "Estimated Reflex decision-call token equivalent used for supervision ROI budgeting."}
  work_estimated_jev_call_tokens: {type: int, default: 800, description: "Legacy alias for work_estimated_decision_call_tokens."}
  work_provider_decisions_enabled: {type: bool, default: true}
  work_directive_high_confidence: {type: float, default: 0.90}
  work_directive_watch_confidence: {type: float, default: 0.75}
  work_repeated_failure_trigger: {type: int, default: 2}
  work_directive_max_chars: {type: int, default: 320}
  work_completion_controller_attempts: {type: int, default: 3, description: "Bounded controller-local native completion retries after verified PASS; never consumes another worker-model turn."}
  work_auto_estimate_task_budget: {type: bool, default: true, description: "Estimate a conservative per-task worker budget from DoD complexity instead of using only the static floor."}
  work_budget_dod_required: {type: bool, default: true, description: "Append non-blocking budget telemetry to the contract. Budget is execution policy, not a required correctness criterion."}
  work_budget_dod_tolerance: {type: float, default: 1.10, description: "Small completion tolerance above the estimated target to reduce false-positive budget failures."}
  work_budget_estimator_base_tokens: {type: int, default: 120000}
  work_budget_estimator_per_criterion_tokens: {type: int, default: 75000}
  work_budget_estimator_body_char_factor: {type: float, default: 25.0}
  work_budget_estimator_safety_multiplier: {type: float, default: 1.25}
  work_budget_estimator_max_tokens: {type: int, default: 2000000}
  work_nerve_observer_enabled: {type: bool, default: true, description: "Continuously evaluate worker token trajectory after every provider response."}
  work_nerve_auto_kill: {type: bool, default: false, description: "Deprecated compatibility setting. Reflex/Nerve no longer owns economic kill authority; budget escalation routes to orchestrator review."}
  work_nerve_watch_fraction: {type: float, default: 0.65}
  work_nerve_forecast_fraction: {type: float, default: 0.80, description: "At this fraction of the base target, ask YES/NO/MAYBE whether one bounded extension is likely to finish."}
  work_nerve_extension_fraction: {type: float, default: 0.25, description: "One automatic extension size after a confident YES forecast."}
  work_nerve_extension_min_confidence: {type: float, default: 0.60, description: "Minimum YES confidence for the single automatic extension; lower-confidence YES is treated as MAYBE and reviewed."}
  work_nerve_no_handoff_fraction: {type: float, default: 0.90, description: "A NO forecast may use a short checkpoint window but must hand off to orchestrator review by this consumed fraction of the base target."}
  work_nerve_replan_fraction: {type: float, default: 0.90}
  work_nerve_hard_budget_multiplier: {type: float, default: 1.75, description: "Hard economic circuit breaker; crossing the estimate alone does not kill a run."}
  work_nerve_min_calls_before_kill: {type: int, default: 12}
  work_nerve_repeated_failure_kill: {type: int, default: 3}
  work_nerve_high_context_streak_kill: {type: int, default: 3}
  remote_hosts: {type: dict, default: {}}
  remote_default_host: {type: str, default: ""}
  remote_default_max_turns: {type: int, default: 100}
  remote_default_task_timeout_seconds: {type: int, default: 3600}
  remote_data_dir: {type: str, default: ""}